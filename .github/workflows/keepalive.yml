# Supabase（無料プラン）の自動停止を防ぐ見張り役。
# 主役は Vercel の日次 cron（vercel.json → /api/health）。こちらは別経路から1日2回叩き、
# DB に届かなければジョブを失敗させる（GitHub から失敗通知のメールが届くので停止にすぐ気付ける）。
# ※公開リポジトリでは、60日間コミットが無いとスケジュール実行が自動で止まる（GitHub の仕様）。
name: keep-alive

on:
  schedule:
    - cron: "23 0,12 * * *" # 09:23 / 21:23 JST
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o body.json -w "%{http_code}" --max-time 30 https://putting-analyzer-v2.vercel.app/api/health || true)
            echo "attempt $i: HTTP $code $(cat body.json 2>/dev/null)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::データベースに接続できません。Supabase が停止している可能性があります（Dashboard で Restore）"
          exit 1
